<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
      background-size: 400% 400%;
      animation: rgbFlow 20s ease infinite;
      color: #000;
      font-family: 'Lato', sans-serif;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      text-align: center;
    }

    @keyframes rgbFlow {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    input[type="text"] {
      width: 80%;
      max-width: 500px;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: #000;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background: #f1f1f1;
      transform: scale(1.05);
    }

    .qr-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
    }

    .caption {
      font-size: 14px;
      color: #000;
      margin: 8px 0;
    }

    .download-btn {
      font-size: 14px;
      padding: 6px 14px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }

    .download-btn:hover {
      background-color: #333;
    }

    .contactus {
      margin-top: 2rem;
    }

    .instagram-logo {
      width: 22px;
      vertical-align: middle;
      margin-right: 8px;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img src="https://iili.io/FK3bcx9.png" width="350" height="120">
  <h1>QR Code Generator</h1>

  <div class="input-group">
    <input id="text" type="text" placeholder="Paste your link here" />
    <button onclick="generate()">Generate</button>
  </div>

  <div id="codes" class="qr-container"></div>

  <div class="contactus">
    <div class="owner">Owned by Shubham Karpe</div>
    <a href="https://www.instagram.com/sparknest.tools/" target="_blank">
      <img class="instagram-logo" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"/>sparknest.tools
    </a><br/>
    <a href="https://www.instagram.com/itz_shubham_09_/" target="_blank">
      <img class="instagram-logo" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"/>@itz_shubham_09_
    </a>
  </div>

  <script>
    const styles = [];
    const dotsTypes = ["square", "dots", "rounded", "extra-rounded", "classy", "classy-rounded"];
    const eyeTypes = ["square", "dot", "extra-rounded"];
    const colors = [
      "#e91e63", "#3f51b5", "#009688", "#ff5722", "#4caf50", "#673ab7",
      "#ffc107", "#607d8b", "#00bcd4", "#f44336", "#ff9800", "#8bc34a",
      "#795548", "#9c27b0", "#2196f3", "#cddc39"
    ];

    for (let i = 0; i < 48; i++) {
      styles.push({
        dotsOptions: { type: dotsTypes[i % dotsTypes.length] },
        cornersSquareOptions: { type: eyeTypes[i % eyeTypes.length] },
        color: colors[i % colors.length]
      });
    }

    function generate() {
      const url = document.getElementById('text').value.trim();
      if (!url) {
        alert('Please paste a link to generate QR codes.');
        return;
      }

      const container = document.getElementById('codes');
      container.innerHTML = '';

      const standardBox = document.createElement('div');
      standardBox.className = 'qr-box';

      const standardCanvas = document.createElement('div');
      standardBox.appendChild(standardCanvas);

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.innerText = "Standard QR";
      standardBox.appendChild(caption);

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'download-btn';
      downloadBtn.innerText = 'Download';
      standardBox.appendChild(downloadBtn);

      const standardQR = new QRCodeStyling({
        width: 160,
        height: 160,
        data: url,
        dotsOptions: {
          color: "#000000",
          type: "square"
        },
        cornersSquareOptions: {
          type: "square",
          color: "#000000"
        },
        backgroundOptions: {
          color: "#ffffff"
        }
      });

      standardQR.append(standardCanvas);
      downloadBtn.onclick = () => {
        standardQR.download({ name: "standard-qr-code", extension: "png" });
      };
      container.appendChild(standardBox);

      styles.forEach((style, index) => {
        const qrBox = document.createElement('div');
        qrBox.className = 'qr-box';

        const qrCanvas = document.createElement('div');
        qrBox.appendChild(qrCanvas);

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.innerText = `${style.dotsOptions.type}, ${style.cornersSquareOptions.type}`;
        qrBox.appendChild(caption);

        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'download-btn';
        downloadBtn.innerText = 'Download';
        qrBox.appendChild(downloadBtn);

        const qrCode = new QRCodeStyling({
          width: 160,
          height: 160,
          data: url,
          dotsOptions: {
            color: style.color,
            type: style.dotsOptions.type
          },
          cornersSquareOptions: {
            type: style.cornersSquareOptions.type,
            color: style.color
          },
          backgroundOptions: {
            color: "#ffffff"
          }
        });

        qrCode.append(qrCanvas);
        downloadBtn.onclick = () => {
          qrCode.download({ name: `styled-qr-${index + 1}`, extension: "png" });
        };

        container.appendChild(qrBox);
      });
    }
  </script>
</body>
</html>
