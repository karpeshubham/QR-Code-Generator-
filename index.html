<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    #controls {
      text-align: center;
      margin-bottom: 30px;
    }
    .input-group {
      display: inline-flex;
      gap: 30px; /* Increased spacing */
      align-items: center;
      margin-top: 20px;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #fff;
      background: #000;
      color: #fff;
      font-family: inherit;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: 2px solid #fff;
      background: #000;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background-color: #fff;
      color: #000;
    }
    .qr-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .qr-box {
      background: #fff;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
    }
    .caption {
      font-size: 12px;
      color: #000;
      margin: 5px 0;
    }
    .download-btn {
      font-size: 12px;
      padding: 5px 10px;
      margin-top: 5px;
      background-color: #000;
      color: #fff;
      border: 1px solid #000;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <div id="controls">
    <div class="input-group">
      <input id="text" type="text" placeholder="Paste your link here" />
      <button onclick="generate()">Generate</button>
    </div>
  </div>
  <div id="codes" class="qr-container"></div>

  <script>
    const styles = [];
    const dotsTypes = ["square", "dots", "rounded", "extra-rounded", "classy", "classy-rounded"];
    const eyeTypes = ["square", "dot", "extra-rounded"];
    const colors = [
      "#e91e63", "#3f51b5", "#009688", "#ff5722", "#4caf50", "#673ab7",
      "#ffc107", "#607d8b", "#00bcd4", "#f44336", "#ff9800", "#8bc34a",
      "#795548", "#9c27b0", "#2196f3", "#cddc39"
    ];

    for (let i = 0; i < 48; i++) {
      styles.push({
        dotsOptions: { type: dotsTypes[i % dotsTypes.length] },
        cornersSquareOptions: { type: eyeTypes[i % eyeTypes.length] },
        color: colors[i % colors.length]
      });
    }

    function generate() {
      const url = document.getElementById('text').value.trim();
      if (!url) {
        alert('Please paste a link to generate QR codes.');
        return;
      }

      const container = document.getElementById('codes');
      container.innerHTML = '';

      const standardBox = document.createElement('div');
      standardBox.className = 'qr-box';

      const standardCanvas = document.createElement('div');
      standardBox.appendChild(standardCanvas);

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.innerText = "Standard QR";
      standardBox.appendChild(caption);

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'download-btn';
      downloadBtn.innerText = 'Download';
      standardBox.appendChild(downloadBtn);

      const standardQR = new QRCodeStyling({
        width: 160,
        height: 160,
        data: url,
        dotsOptions: {
          color: "#000000",
          type: "square"
        },
        cornersSquareOptions: {
          type: "square",
          color: "#000000"
        },
        backgroundOptions: {
          color: "#ffffff"
        }
      });

      standardQR.append(standardCanvas);
      downloadBtn.onclick = () => {
        standardQR.download({ name: "standard-qr-code", extension: "png" });
      };
      container.appendChild(standardBox);

      styles.forEach((style, index) => {
        const qrBox = document.createElement('div');
        qrBox.className = 'qr-box';

        const qrCanvas = document.createElement('div');
        qrBox.appendChild(qrCanvas);

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.innerText = `${style.dotsOptions.type}, ${style.cornersSquareOptions.type}`;
        qrBox.appendChild(caption);

        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'download-btn';
        downloadBtn.innerText = 'Download';
        qrBox.appendChild(downloadBtn);

        const qrCode = new QRCodeStyling({
          width: 160,
          height: 160,
          data: url,
          dotsOptions: {
            color: style.color,
            type: style.dotsOptions.type
          },
          cornersSquareOptions: {
            type: style.cornersSquareOptions.type,
            color: style.color
          },
          backgroundOptions: {
            color: "#ffffff"
          }
        });

        qrCode.append(qrCanvas);
        downloadBtn.onclick = () => {
          qrCode.download({ name: `styled-qr-${index + 1}`, extension: "png" });
        };

        container.appendChild(qrBox);
      });
    }
  </script>
</body>
</html>
